services:
  - type: web
    name: weraiko-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn weraiko.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        fromDatabase:
          name: weraiko-db
          property: connectionString

databases:
  - name: weraiko-db
    plan: free